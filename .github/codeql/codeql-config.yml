name: "CodeQL config"

# Paths to ignore for all queries
paths-ignore:
  - 'node_modules/**'
  - '.next/**'
  - 'dist/**'
  - 'build/**'

# Query filters
query-filters:
  # Exclude path-injection query for fileStorage.ts
  # We have defense-in-depth validation:
  # 1. Input sanitization (alphanumeric + hyphens/underscores only)
  # 2. Category whitelist validation
  # 3. MIME type whitelist validation
  # 4. Safe path construction with join()
  # 5. Final absolute path validation
  - exclude:
      id: js/path-injection
      paths:
        - src/lib/utils/fileStorage.ts
