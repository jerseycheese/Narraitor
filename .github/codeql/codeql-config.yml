name: "CodeQL config"

# Paths to ignore for all queries
paths-ignore:
  - 'node_modules/**'
  - '.next/**'
  - 'dist/**'
  - 'build/**'

# Disable specific queries
# Note: js/path-injection excluded for fileStorage.ts because:
# - Input sanitization (alphanumeric + hyphens/underscores only)
# - Category whitelist validation
# - MIME type whitelist validation
# - Safe path construction with join()
# - Final absolute path validation within allowed directory
disable-default-queries: false

queries:
  - uses: security-and-quality
  - exclude:
      id: js/path-injection
