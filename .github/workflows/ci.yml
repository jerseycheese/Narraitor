name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run ESLint  
        run: npm run lint
      - name: Run Stylelint (CSS Design Token Enforcement)
        run: npm run lint:css
      - name: Enforce non-self-closing PageLayout usage
        run: npm run lint:layout-usage

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run tests
        run: npm run test
      - name: Check code coverage
        run: npm run test:coverage

  build:
    name: Build Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build application
        run: npm run build

  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build Storybook
        run: npm run build-storybook

  e2e:
    name: E2E Tests
    runs-on: macos-latest
    needs: [build]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run E2E tests (fail on visual diffs)
        run: npm run test:e2e:critical
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-failures
          path: test-results/
          retention-days: 7
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-html-report
          path: |
            playwright-report/
            !playwright-report/**/*.zip
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    env:
      NODE_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Prepare security report directory
        run: mkdir -p ci-security

      - name: Run npm audit (fails on high severity only)
        # Non-blocking during initial rollout; flip to false once issues #787/#788 land.
        run: npm audit --production --audit-level=high | tee ci-security/npm-audit.txt
        continue-on-error: true

      - name: Generate npm audit JSON report
        run: npm audit --production --json > ci-security/npm-audit.json
        continue-on-error: true

      - name: Capture dependency update suggestions
        run: npm outdated --json > ci-security/npm-outdated.json
        continue-on-error: true

      - name: Generate security scan summary
        run: node .github/scripts/generate-security-summary.js

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-${{ github.run_id }}
          path: ci-security
          retention-days: 14
