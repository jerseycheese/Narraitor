name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]
    # Default types (opened, synchronize, reopened) plus edited: the
    # visual-baseline-check job below reads the PR body, so it needs to
    # re-run when the author edits baseline notes without pushing a commit.
    types: [ opened, synchronize, reopened, edited ]

jobs:
  # Phase 1: Setup job - Install dependencies once and cache for all other jobs
  #
  # Skipped on a PR-body-only edit: every job below except
  # visual-baseline-check needs this one (directly or transitively), so
  # skipping it here keeps the 'edited' trigger scoped to that one job
  # instead of re-running the whole pipeline for a body edit with no commit.
  setup:
    name: Setup Dependencies
    runs-on: ubuntu-latest
    if: github.event.action != 'edited'
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cache node_modules
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

  # Phase 2: TypeScript type-checking (fast, parallel with lint/test)
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Run TypeScript type check
        run: npm run type-check

  lint:
    name: Lint Check
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache ESLint
        uses: actions/cache@v4
        with:
          path: .eslintcache
          key: ${{ runner.os }}-eslint-${{ hashFiles('**/*.ts', '**/*.tsx', '**/*.js', '**/*.jsx', '.eslintrc*') }}
          restore-keys: |
            ${{ runner.os }}-eslint-

      - name: Cache Stylelint
        uses: actions/cache@v4
        with:
          path: .stylelintcache
          key: ${{ runner.os }}-stylelint-${{ hashFiles('**/*.css', '**/*.scss', '.stylelintrc*') }}
          restore-keys: |
            ${{ runner.os }}-stylelint-

      - name: Run ESLint
        run: npm run lint
      - name: Run Stylelint (CSS Design Token Enforcement)
        run: npm run lint:css
      - name: Enforce non-self-closing PageLayout usage
        run: npm run lint:layout-usage
      - name: Enforce design-system canon (living style guide)
        run: npm run lint:ds-canon
      - name: Enforce dependency boundaries (no new cycles or dev-dep leaks)
        run: npm run deps:validate
      # Blocking, and the other half of the ratchet: `deps:validate` stops new
      # violations landing, this stops fixed ones lingering as dead suppressions.
      - name: Enforce a shrinking dependency baseline
        run: npm run deps:check

  knip:
    name: Knip (unused code)
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # Blocking: fails the check on any unused dependency, export, or type so
      # dead code can't accumulate (#1231).
      - name: Run Knip
        run: npm run knip

  skott-cycles:
    name: Skott circular-dep budget
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # Blocking: fails when the count of circular dependencies reachable from
      # the app entrypoint exceeds the baseline in `.skott-baseline.json`.
      # Intentional new cycles bump the baseline; accidental new cycles get
      # fixed (run `npm run skott:circular` locally to inspect which loop is new).
      - name: Run skott:check
        run: npm run skott:check

  audit-css:
    name: CSS audit (unused selectors)
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # The audit script exits 0 on findings (it only fails on a genuine error,
      # e.g. a broken script or missing file), so findings surface in the logs
      # without failing the check. No `|| true` -- that would also hide a broken
      # audit. Review the output and prune manually (#1087).
      - name: Run CSS audit
        run: npm run audit:css

  visual-baseline-check:
    name: Visual Baseline Check
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Advisory, like audit-css below: no node_modules needed, the script
      # only uses git and Node builtins. Flags a PR that changes src/** and a
      # visual-test snapshot together, and any changed snapshot the PR body
      # never mentions -- never fails the build, just surfaces it.
      - name: Check visual baseline changes are documented
        env:
          BASE_REF: origin/${{ github.event.pull_request.base.ref }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: node scripts/check-visual-baseline.mjs

  docs-check:
    name: Docs Check
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      # Blocking: a relative link or anchor either resolves or it doesn't --
      # no judgment call, so unlike the symbol check below it's safe to gate
      # (#1651, follow-up to the #1638 docs correctness sweep).
      - name: Check internal doc links
        run: npm run docs:check-links

      # Advisory prototype, not a gate: whether a backticked span is a code
      # reference or plain English is a judgment call, so this exits 0 on
      # findings (same failure ergonomics as `audit-css` above) and prints a
      # worklist instead. Review the output and expand the tolerance list in
      # scripts/check-docs-symbols.mjs as false positives show up.
      - name: Check doc symbol references (advisory)
        run: npm run docs:check-symbols

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Jest
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/jest
            .jest-cache
          key: ${{ runner.os }}-jest-${{ hashFiles('**/*.test.ts', '**/*.test.tsx', 'jest.config.*') }}
          restore-keys: |
            ${{ runner.os }}-jest-

      - name: Run tests with coverage
        run: npm run test:ci

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [setup, type-check, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('**/*.js', '**/*.jsx', '**/*.ts', '**/*.tsx', 'next.config.*') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      # getSiteUrl() refuses to fall back to localhost in a production build, so
      # the origin has to be declared. This artifact is only ever compiled and
      # thrown away, never served, so the value itself doesn't matter — the real
      # deployment gets NEXT_PUBLIC_SITE_URL from its platform config.
      - name: Build application
        env:
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
        run: npm run build

  storybook:
    name: Storybook Build
    runs-on: ubuntu-latest
    needs: [setup, type-check, lint]
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Cache Storybook build
        uses: actions/cache@v4
        with:
          path: |
            node_modules/.cache/storybook
          key: ${{ runner.os }}-storybook-${{ hashFiles('**/*.stories.tsx', '**/*.stories.ts', '.storybook/**/*') }}
          restore-keys: |
            ${{ runner.os }}-storybook-

      - name: Build Storybook
        run: npm run build-storybook

  e2e:
    name: E2E Tests
    runs-on: macos-latest
    needs: [build]
    # Shard across runners and force --workers=1 per shard. The visual suite's
    # timeouts (#1344) come from worker concurrency against a single `next dev`
    # server: two workers hitting two uncompiled routes at once stall the
    # single-process dev server past the navigation timeout. One worker per shard
    # removes that contention entirely; sharding keeps wall-clock reasonable.
    # Stays on `next dev` so rendering (and committed baselines) is unchanged.
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        id: cache-deps
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Install dependencies
        if: steps.cache-deps.outputs.cache-hit != 'true'
        run: npm ci

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - name: Run E2E tests (fail on visual diffs)
        run: npm run test:e2e:critical -- --shard=${{ matrix.shard }}/2 --workers=1
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-test-failures-shard${{ matrix.shard }}
          path: test-results/
          retention-days: 7
      - name: Upload HTML report
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-html-report-shard${{ matrix.shard }}
          path: |
            playwright-report/
            !playwright-report/**/*.zip
          retention-days: 7

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [setup]
    env:
      NODE_ENV: production
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Restore node_modules cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: Prepare security report directory
        run: mkdir -p ci-security

      - name: Run npm audit (fails on moderate severity or higher)
        run: |
          set -o pipefail
          npm audit --omit=dev --audit-level=moderate | tee ci-security/npm-audit.txt
        continue-on-error: false

      - name: Generate npm audit JSON report
        run: npm audit --omit=dev --json > ci-security/npm-audit.json
        continue-on-error: true

      - name: Capture dependency update suggestions
        run: npm outdated --json > ci-security/npm-outdated.json
        continue-on-error: true

      - name: Generate security scan summary
        run: node .github/scripts/generate-security-summary.js

      - name: Upload security artifacts
        uses: actions/upload-artifact@v4
        with:
          name: security-scan-${{ github.run_id }}
          path: ci-security
          retention-days: 14
