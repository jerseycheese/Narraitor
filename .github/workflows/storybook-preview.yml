name: Storybook Preview Build

on:
  pull_request:
    branches: [ develop ]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  build-preview:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
    
    - run: npm ci
    - run: npm run build-storybook
    
    - name: Upload Storybook Preview
      uses: actions/upload-artifact@v4
      with:
        name: storybook-preview-${{ github.event.number }}
        path: ./storybook-static
        retention-days: 7
    
    - name: Comment PR with download link
      uses: actions/github-script@v7
      with:
        script: |
          const { owner, repo } = context.repo;
          const pr_number = context.payload.pull_request.number;
          
          // Check if we've already posted a Storybook preview comment
          const comments = await github.rest.issues.listComments({
            owner,
            repo,
            issue_number: pr_number
          });
          
          const existingComment = comments.data.find(comment => 
            comment.body.includes('📚 **Storybook Preview Built!**')
          );
          
          if (existingComment) {
            // Update the existing comment instead of creating a new one
            await github.rest.issues.updateComment({
              owner,
              repo,
              comment_id: existingComment.id,
              body: `📚 **Storybook Preview Built!**
              
              Your design token documentation is ready for preview.
              
              **Download the preview:**
              1. Go to the [Actions tab](https://github.com/${owner}/${repo}/actions/runs/${{ github.run_id }})
              2. Download the "storybook-preview-${pr_number}" artifact
              3. Extract and open \`index.html\` in your browser
              
              **Or wait for merge to develop to see it live at:**
              https://${owner}.github.io/${repo}/
              
              _Updated: ${{ github.run_id }}_`
            });
          } else {
            // Create new comment only if none exists
            await github.rest.issues.createComment({
              owner,
              repo,
              issue_number: pr_number,
              body: `📚 **Storybook Preview Built!**
              
              Your design token documentation is ready for preview.
              
              **Download the preview:**
              1. Go to the [Actions tab](https://github.com/${owner}/${repo}/actions/runs/${{ github.run_id }})
              2. Download the "storybook-preview-${pr_number}" artifact
              3. Extract and open \`index.html\` in your browser
              
              **Or wait for merge to develop to see it live at:**
              https://${owner}.github.io/${repo}/`
            });
          }