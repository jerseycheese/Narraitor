version: '3.8'

# ──────────────────────────────────────────────────────────────────────────────
# Claude Code auto-fix sandbox (formerly docker-compose.yolo.yml)
#
# Runs `claude --dangerously-skip-permissions` inside an isolated container
# with `network_mode: none` to attempt a given GitHub issue end-to-end.
#
# REQUIRES a local `.claude/docker/Dockerfile.yolo` (gitignored via `.claude/*`).
# This compose file alone will NOT build — the Dockerfile lives outside the repo.
#
# DO NOT run on shared machines. The container mounts ~/.ssh and ~/.gitconfig
# read-only so it can author commits as you. Treat with the same caution as
# running `claude --dangerously-skip-permissions` on bare metal.
#
# Usage: ISSUE_NUMBER=501 docker-compose -f docker-compose.claude-autofix.yml up
# ──────────────────────────────────────────────────────────────────────────────

services:
  claude-autofix:
    build:
      context: .
      dockerfile: .claude/docker/Dockerfile.yolo
    container_name: claude-autofix-${ISSUE_NUMBER:-000}
    volumes:
      # Mount the specific worktree
      - ${WORKTREE_PATH:-./}:/app
      # Mount Claude config as read-only
      - ~/.claude:/home/claude/.claude:ro
      # Mount git config
      - ~/.gitconfig:/home/claude/.gitconfig:ro
      # Mount SSH keys for git operations (read-only)
      - ~/.ssh:/home/claude/.ssh:ro
    environment:
      # Pass through API keys if needed for local mocks
      - GEMINI_API_KEY=${GEMINI_API_KEY:-mock}
      - NODE_ENV=development
      - ISSUE_NUMBER=${ISSUE_NUMBER:-000}
      # Claude Code specific
      - CLAUDE_SKIP_PERMISSIONS=true
    # CRITICAL: No network access for safety
    network_mode: none
    # Ensure container stops after Claude completes
    stdin_open: true
    tty: true
    command: |
      sh -c "
        echo 'Starting Claude Code auto-fix for issue #${ISSUE_NUMBER}' &&
        cd /app &&
        claude --dangerously-skip-permissions /project:do-issue-auto ${ISSUE_NUMBER}
      "

  # Optional: Local API mock service
  # Uncomment if you need to mock external APIs
  # api-mock:
  #   image: node:20-alpine
  #   volumes:
  #     - ./.claude/mocks:/app
  #   working_dir: /app
  #   command: node api-mock-server.js
  #   networks:
  #     - autofix-internal

# networks:
#   autofix-internal:
#     internal: true  # No external connectivity
